
<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BS DOWNLOAD HUB</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #070914;
  color: white;
}

header {
  padding: 55px 20px 40px;
  text-align: center;
  background: radial-gradient(circle at top, #153c65, #101126 65%, #070914);
  border-bottom: 1px solid #174d70;
}

.logo {
  font-size: 34px;
  font-weight: 900;
  color: #00eaff;
  text-shadow: 0 0 18px #00c8ff;
}

header p {
  color: #aab9d1;
  font-size: 14px;
}

.insta {
  display: inline-block;
  margin-top: 15px;
  padding: 12px 22px;
  border-radius: 10px;
  color: white;
  text-decoration: none;
  font-weight: bold;
  background: linear-gradient(90deg,#753bff,#00bfff);
  box-shadow: 0 0 15px #246bff55;
}

.container {
  max-width: 950px;
  margin: auto;
  padding: 30px 18px;
}

.section-title {
  color: #00eaff;
  font-size: 21px;
  margin-bottom: 20px;
}

.search {
  width: 100%;
  padding: 15px;
  border: 1px solid #263b5d;
  background: #11182a;
  color: white;
  border-radius: 12px;
  outline: none;
  margin-bottom: 25px;
  font-size: 15px;
}

.search:focus {
  border-color: #00eaff;
  box-shadow: 0 0 12px #00eaff44;
}

.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(230px,1fr));
  gap: 20px;
}

.card {
  background: linear-gradient(145deg,#131c30,#0b1020);
  border: 1px solid #263e62;
  border-radius: 16px;
  padding: 23px;
  transition: .3s;
  box-shadow: 0 5px 20px #0005;
}

.card:hover {
  transform: translateY(-6px);
  border-color: #00eaff;
  box-shadow: 0 0 20px #00c8ff30;
}

.icon {
  font-size: 35px;
  margin-bottom: 12px;
}

.card h3 {
  color: #fff;
  margin: 5px 0 10px;
}

.card p {
  color: #9baac4;
  font-size: 13px;
}

.tag {
  display: inline-block;
  padding: 5px 10px;
  background: #102b42;
  color: #00eaff;
  border-radius: 6px;
  font-size: 11px;
  margin-top: 5px;
}

.btn {
  display: block;
  margin-top: 20px;
  padding: 13px;
  border-radius: 9px;
  text-align: center;
  text-decoration: none;
  color: #06101a;
  font-weight: bold;
  background: linear-gradient(90deg,#00eaff,#00ffae);
  transition: .3s;
}

.btn:hover {
  box-shadow: 0 0 18px #00eaff88;
  transform: scale(1.03);
}

footer {
  margin-top: 40px;
  padding: 25px;
  text-align: center;
  color: #66758e;
  font-size: 12px;
  border-top: 1px solid #19253b;
}

footer strong {
  color: #00eaff;
}

.hidden {
  display: none;
}
</style>
</head>

<body>

<header>
  <div class="logo">🔥 BS DOWNLOAD HUB</div>
  <p>SEU UNIVERSO DE DOWNLOADS ⚡</p>

  <a class="insta"
     href="https://www.instagram.com/renanzinmw/"
     target="_blank">
     📷 MEU INSTAGRAM
  </a>
</header>

<div class="container">

  <h2 class="section-title">📁 DOWNLOADS</h2>

  <input
    class="search"
    type="text"
    id="search"
    placeholder="🔎 Pesquisar aplicativo..."
    oninput="searchApps()"
  >

  <div class="cards" id="cards">

    <div class="card">
      <div class="icon">🎮</div>
      <h3>REI MOD </h3>
      <p>KEY: 4T24-5PB1-3UHW</p>
      <span class="tag">FREE FIRE MAX</span>

      <a class="btn"
         href="https://www.mediafire.com/file/2kglk9m9osqt6dj/REIMOD_V41jb.apk/file"
         target="_blank">
         ⬇ BAIXAR AGORA
      </a>
    </div>

    <div class="card">
      <div class="icon">⚡</div>
      <h3>RISHABH WIRE</h3>
      <p>SEM KEY</p>
      <span class="tag">FREE FIRE E FREE FIRE MAX</span>

      <a class="btn"
         href="https://www.mediafire.com/file/a8tllnv892ixivn/RISHABH+WIRE+V22.apk/file"
         target="_blank">
         ⬇ BAIXAR AGORA
      </a>
    </div>

  </div>

  <p id="empty" class="hidden">
    Nenhum aplicativo encontrado.
  </p>

</div>

<footer>
  © 2026 <strong>BS RENANZIN</strong><br><br>
  TODOS OS DIREITOS RESERVADOS ⚡
</footer>

<script>
function searchApps() {
  const search = document
    .getElementById("search")
    .value.toLowerCase();

  const cards = document.querySelectorAll(".card");
  let found = 0;

  cards.forEach(card => {
    const match = card.innerText.toLowerCase().includes(search);

    card.classList.toggle("hidden", !match);

    if (match) found++;
  });

  document.getElementById("empty")
    .classList.toggle("hidden", found > 0);
}
</script>

</body>
</html>
